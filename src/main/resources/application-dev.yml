spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/aikb?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    '[com.example.aikb]': DEBUG
jwt:
  # Local development default only. Override with JWT_SECRET in real environments.
  secret: ${JWT_SECRET:dev-only-jwt-secret-please-change-2026-very-long}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:aikb-backend}

app:
  llm:
    enabled: true
    base-url: ${APP_LLM_BASE_URL:${OPENAI_LLM_BASE_URL:https://api.xiaocaseai.com/v1/messages}}
    api-key: ${APP_LLM_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_LLM_MODEL:claude-opus-4-6}
    max-tokens: 1024
    connect-timeout: 10s
    read-timeout: 60s
  embedding:
    enabled: true
    base-url: ${APP_EMBEDDING_BASE_URL:${OPENAI_EMBEDDING_BASE_URL:https://api.xiaocaseai.com/v1/embeddings}}
    api-key: ${APP_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_EMBEDDING_MODEL:text-embedding-3-large}
    normalized: true
    embedding-type: float
    connect-timeout: 5s
    read-timeout: 60s
