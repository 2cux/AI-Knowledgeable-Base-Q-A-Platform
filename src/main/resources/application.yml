spring:
  application:
    name: enterprise-ai-knowledge-base-qna-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080

jwt:
  # Local development default only. Override with JWT_SECRET in real environments.
  secret: ${JWT_SECRET:dev-only-jwt-secret-please-change-2026-very-long}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:aikb-backend}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.aikb.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR:uploads}
    max-size: 20MB
  debug:
    ai-test:
      enabled: false
  rag:
    retrieval:
      top-k: ${APP_RAG_RETRIEVAL_TOP_K:5}
      min-effective-score: ${APP_RAG_RETRIEVAL_MIN_EFFECTIVE_SCORE:0.2}
  llm:
    enabled: true
    # AI sensitive config must come from environment variables instead of committed secrets.
    base-url: ${APP_LLM_BASE_URL:${OPENAI_LLM_BASE_URL:https://api.xiaocaseai.com/v1/messages}}
    api-key: ${APP_LLM_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_LLM_MODEL:claude-opus-4-6}
    max-tokens: 1024
    connect-timeout: 5s
    read-timeout: 60s
  embedding:
    enabled: true
    # Prefer APP_EMBEDDING_* variables when embedding and chat use different vendors or gateways.
    base-url: ${APP_EMBEDDING_BASE_URL:${OPENAI_EMBEDDING_BASE_URL:https://api.xiaocaseai.com/v1/embeddings}}
    api-key: ${APP_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_EMBEDDING_MODEL:text-embedding-3-large}
    normalized: true
    embedding-type: float
    connect-timeout: 5s
    read-timeout: 60s

logging:
  level:
    root: INFO
    '[com.example.aikb]': DEBUG
