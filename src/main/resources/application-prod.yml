spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms

app:
  mq:
    document-process:
      exchange: aikb.document.exchange
      queue: aikb.document.process.queue
      routing-key: aikb.document.process
      dead-letter-exchange: aikb.document.dlx
      dead-letter-queue: aikb.document.process.dlq
      dead-letter-routing-key: aikb.document.process.dlq
  cache:
    admin:
      stats-ttl-minutes: ${ADMIN_STATS_CACHE_TTL_MINUTES:5}
      hot-questions-ttl-minutes: ${HOT_QUESTIONS_CACHE_TTL_MINUTES:5}
  debug:
    ai-test:
      # Production must keep AI debug endpoints disabled by default.
      enabled: false

jwt:
  # Production must provide JWT_SECRET explicitly. Do not fall back to local development defaults.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:aikb-prod}
