spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}

app:
  cache:
    admin:
      stats-ttl-minutes: ${ADMIN_STATS_CACHE_TTL_MINUTES:5}
      hot-questions-ttl-minutes: ${HOT_QUESTIONS_CACHE_TTL_MINUTES:5}
  debug:
    ai-test:
      # Production must keep AI debug endpoints disabled by default.
      enabled: false

jwt:
  # Production must provide JWT_SECRET explicitly. Do not fall back to local development defaults.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:aikb-prod}
