spring:
  application:
    name: enterprise-ai-knowledge-base-qna-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${APP_FILE_MAX_SIZE:20MB}
      max-request-size: ${APP_FILE_MAX_SIZE:20MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aikb}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:please_change_this_secret}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:aikb-backend}

app:
  mq:
    document-process:
      exchange: aikb.document.exchange
      queue: aikb.document.process.queue
      routing-key: aikb.document.process
      dead-letter-exchange: aikb.document.dlx
      dead-letter-queue: aikb.document.process.dlq
      dead-letter-routing-key: aikb.document.process.dlq
    document-embedding:
      exchange: aikb.document.exchange
      queue: aikb.document.embedding.queue
      routing-key: aikb.document.embedding
      dead-letter-exchange: aikb.document.dlx
      dead-letter-queue: aikb.document.embedding.dlq
      dead-letter-routing-key: aikb.document.embedding.dlq
  cache:
    admin:
      stats-ttl-minutes: ${ADMIN_STATS_CACHE_TTL_MINUTES:5}
      hot-questions-ttl-minutes: ${HOT_QUESTIONS_CACHE_TTL_MINUTES:5}
  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR:uploads}
    max-size: ${APP_FILE_MAX_SIZE:20MB}
  debug-api:
    enabled: ${APP_DEBUG_API_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  rag:
    retrieval:
      top-k: ${APP_RAG_RETRIEVAL_TOP_K:5}
      min-effective-score: ${APP_RAG_RETRIEVAL_MIN_EFFECTIVE_SCORE:0.2}
  llm:
    enabled: ${APP_LLM_ENABLED:true}
    base-url: ${APP_LLM_BASE_URL:https://api.example.com/v1/messages}
    api-key: ${APP_LLM_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_LLM_MODEL:your_chat_model}
    max-tokens: ${APP_LLM_MAX_TOKENS:1024}
    connect-timeout: ${APP_LLM_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_LLM_READ_TIMEOUT:60s}
  embedding:
    enabled: ${APP_EMBEDDING_ENABLED:true}
    base-url: ${APP_EMBEDDING_BASE_URL:https://api.example.com/v1/embeddings}
    api-key: ${APP_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_EMBEDDING_MODEL:text-embedding-3-large}
    vector-size: ${APP_EMBEDDING_VECTOR_SIZE:${EMBEDDING_VECTOR_SIZE:3072}}
    normalized: ${APP_EMBEDDING_NORMALIZED:true}
    embedding-type: ${APP_EMBEDDING_TYPE:float}
    connect-timeout: ${APP_EMBEDDING_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_EMBEDDING_READ_TIMEOUT:60s}
