spring:
  application:
    name: enterprise-ai-knowledge-base-qna-backend
  servlet:
    multipart:
      max-file-size: ${APP_FILE_MAX_SIZE:20MB}
      max-request-size: ${APP_FILE_MAX_SIZE:20MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080

jwt:
  # Local development default only. Override with JWT_SECRET in real environments.
  secret: ${JWT_SECRET:please-change-this-development-jwt-secret}
  expiration: ${JWT_EXPIRATION:86400000}
  issuer: ${JWT_ISSUER:aikb-backend}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.aikb.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  mq:
    document-process:
      exchange: aikb.document.exchange
      queue: aikb.document.process.queue
      routing-key: aikb.document.process
      dead-letter-exchange: aikb.document.dlx
      dead-letter-queue: aikb.document.process.dlq
      dead-letter-routing-key: aikb.document.process.dlq
    document-embedding:
      exchange: aikb.document.exchange
      queue: aikb.document.embedding.queue
      routing-key: aikb.document.embedding
      dead-letter-exchange: aikb.document.dlx
      dead-letter-queue: aikb.document.embedding.dlq
      dead-letter-routing-key: aikb.document.embedding.dlq
  cache:
    admin:
      stats-ttl-minutes: ${ADMIN_STATS_CACHE_TTL_MINUTES:5}
      hot-questions-ttl-minutes: ${HOT_QUESTIONS_CACHE_TTL_MINUTES:5}
  file:
    upload-dir: ${APP_FILE_UPLOAD_DIR:uploads}
    max-size: ${APP_FILE_MAX_SIZE:20MB}
  debug-api:
    enabled: ${APP_DEBUG_API_ENABLED:false}
  rag:
    retrieval:
      top-k: ${APP_RAG_RETRIEVAL_TOP_K:5}
      min-effective-score: ${APP_RAG_RETRIEVAL_MIN_EFFECTIVE_SCORE:0.2}
  llm:
    enabled: true
    # AI sensitive config must come from environment variables instead of committed secrets.
    base-url: ${APP_LLM_BASE_URL:${OPENAI_LLM_BASE_URL:https://api.example.com/v1/messages}}
    api-key: ${APP_LLM_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_LLM_MODEL:your-chat-model}
    max-tokens: 1024
    connect-timeout: 5s
    read-timeout: 60s
  embedding:
    enabled: true
    # Prefer APP_EMBEDDING_* variables when embedding and chat use different vendors or gateways.
    base-url: ${APP_EMBEDDING_BASE_URL:${OPENAI_EMBEDDING_BASE_URL:https://api.example.com/v1/embeddings}}
    api-key: ${APP_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    model: ${APP_EMBEDDING_MODEL:text-embedding-3-large}
    # Embedding 向量维度，必须与当前模型返回维度一致。
    vector-size: ${APP_EMBEDDING_VECTOR_SIZE:${EMBEDDING_VECTOR_SIZE:3072}}
    normalized: true
    embedding-type: float
    connect-timeout: 5s
    read-timeout: 60s

logging:
  level:
    root: INFO
    '[com.example.aikb]': DEBUG
